name: Native alpha packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - assets/branding/**
      - local-agent/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/alpha.yml
      - .github/workflows/native-packages.yml
  push:
    branches: [main]
    paths:
      - assets/branding/**
      - local-agent/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/alpha.yml
      - .github/workflows/native-packages.yml

permissions:
  contents: read

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: ./.github/workflows/native-packages.yml
    with:
      artifact_name_prefix: free-local-agent-alpha
