name: Native alpha packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - assets/branding/**
      - local-agent/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/alpha.yml
  push:
    branches: [main]
    paths:
      - assets/branding/**
      - local-agent/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/alpha.yml

permissions:
  contents: read

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            node_arch: arm64
            python: local-agent/research/.venv/bin/python
          - os: windows-2022
            target: win32-x64
            node_arch: x64
            python: local-agent/research/.venv/Scripts/python.exe
          - os: ubuntu-24.04
            target: linux-x64
            node_arch: x64
            python: local-agent/research/.venv/bin/python
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EXPECTED_TARGET: ${{ matrix.target }}
      RUSTUP_TOOLCHAIN: '1.96.1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.10.0'
          architecture: ${{ matrix.node_arch }}
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            local-agent/research/requirements-lock.txt
            local-agent/research/requirements-dev.txt
      - name: Check native architecture
        run: node -e "const actual=process.platform+'-'+process.arch;if(actual!==process.env.EXPECTED_TARGET)throw new Error('Expected '+process.env.EXPECTED_TARGET+', got '+actual);console.log(actual)"
      - name: Install desktop dependencies
        run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Install native Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev libvulkan1 libgomp1 libstdc++6
      - name: Check native CMake
        run: cmake --version
      - name: Check Visual Studio C++ toolchain and redistributables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ Build Tools are required for Goose and bundled CRT preparation.' }
          Write-Output "Visual Studio C++ tools: $installation"
      - name: Create research build environment
        run: python -m venv local-agent/research/.venv
      - name: Install pinned research dependencies
        run: ${{ matrix.python }} -m pip install -r local-agent/research/requirements-lock.txt -r local-agent/research/requirements-dev.txt
      - name: Build offline Goose backend
        run: node scripts/prepare-backend.mjs
      - name: Prepare bundled local inference
        run: node scripts/prepare-inference.mjs
      - name: Build experimental Apple Silicon SSD worker
        if: matrix.target == 'darwin-arm64'
        run: npm run prepare:ssd
      - name: Build native research sidecar
        run: node scripts/prepare-research.mjs
      - name: Build desktop and action bridge
        run: npm run build
      - name: Check desktop, isolated runtime, and real Goose integration
        env:
          LOCAL_AGENT_REQUIRE_INTEGRATION: '1'
        run: npm run check
      - name: Check research sidecar
        env:
          PYTHONPATH: ${{ github.workspace }}/local-agent/research
        run: ${{ matrix.python }} -m pytest -q local-agent/research/tests
      - name: Package unsigned native alpha
        run: npm run package
      - name: Verify packaged MCP tools and approval host
        run: npm run smoke:package
      - name: Write artifact checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          artifacts = sorted(p for p in Path('release').iterdir() if p.is_file() and p.suffix in ('.zip', '.deb'))
          if not artifacts:
              raise SystemExit('No native packages were produced')
          lines = []
          for artifact in artifacts:
              with artifact.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              lines.append(f'{digest}  {artifact.name}')
          Path('release/SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Upload native packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: free-local-agent-alpha-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.deb
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
