name: Publish native release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to package and publish (for example v0.5.0-alpha.1).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: metadata
        name: Match tag to package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic-version tag beginning with v (received $RELEASE_TAG)." >&2
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $package_version." >&2
            exit 1
          fi
          prerelease=false
          if [[ "$package_version" == *-alpha* || "$package_version" == *-beta* || "$package_version" == *-rc* ]]; then
            prerelease=true
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$package_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Build release packages
    needs: validate
    uses: ./.github/workflows/native-packages.yml
    with:
      artifact_name_prefix: free-local-agent-release
      checkout_ref: ${{ needs.validate.outputs.tag }}

  publish:
    name: Publish GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}
      - name: Download macOS arm64 package
        uses: actions/download-artifact@v8
        with:
          name: free-local-agent-release-darwin-arm64
          path: release-assets/darwin-arm64
      - name: Download Windows x64 package
        uses: actions/download-artifact@v8
        with:
          name: free-local-agent-release-win32-x64
          path: release-assets/win32-x64
      - name: Download Linux x64 package
        uses: actions/download-artifact@v8
        with:
          name: free-local-agent-release-linux-x64
          path: release-assets/linux-x64
      - name: Verify packages and aggregate checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re

          root = Path('release-assets')
          targets = ('darwin-arm64', 'win32-x64', 'linux-x64')
          packages = []
          for target in targets:
              directory = root / target
              if not directory.is_dir():
                  raise SystemExit(f'Missing downloaded artifact directory: {directory}')
              checksums = list(directory.glob('SHA256SUMS'))
              if len(checksums) != 1:
                  raise SystemExit(f'Expected one SHA256SUMS file in {directory}, found {len(checksums)}')
              entries = [line for line in checksums[0].read_text(encoding='utf-8').splitlines() if line.strip()]
              if not entries:
                  raise SystemExit(f'Empty checksum file: {checksums[0]}')
              target_packages = sorted(p for p in directory.iterdir() if p.is_file() and p.suffix in ('.zip', '.deb'))
              if len(target_packages) != 1:
                  raise SystemExit(f'Expected one native package in {directory}, found {len(target_packages)}')
              package = target_packages[0]
              package_entries = []
              for line in entries:
                  match = re.fullmatch(r'([0-9a-f]{64})  (.+)', line)
                  if not match:
                      raise SystemExit(f'Invalid checksum line in {checksums[0]}: {line}')
                  digest, filename = match.groups()
                  if filename != package.name:
                      raise SystemExit(f'Checksum file {checksums[0]} names {filename}, expected {package.name}')
                  actual = hashlib.sha256(package.read_bytes()).hexdigest()
                  if actual != digest:
                      raise SystemExit(f'Checksum mismatch for {package}')
                  package_entries.append(f'{actual}  {package.name}')
              if len(package_entries) != 1:
                  raise SystemExit(f'Expected one checksum entry in {checksums[0]}')
              packages.append(package)

          names = [package.name for package in packages]
          if len(names) != len(set(names)):
              raise SystemExit('Native package names must be unique across targets')
          aggregate = root / 'SHA256SUMS'
          aggregate.write_text('\n'.join(
              f'{hashlib.sha256(package.read_bytes()).hexdigest()}  {package.name}'
              for package in sorted(packages, key=lambda item: item.name)
          ) + '\n', encoding='utf-8')
          print(f'Verified {len(packages)} packages and wrote {aggregate}')
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<EOF
          ## Free Local Agent $RELEASE_VERSION

          Native packages were built and smoke-tested for macOS arm64, Windows x64, and Ubuntu x64.

          - Download the package for your platform and verify it with [SHA256SUMS](https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/SHA256SUMS).
          - Read the [alpha.5 validation report](https://github.com/$REPOSITORY/blob/$RELEASE_TAG/docs/alpha5-validation.md) and [architecture guide](https://github.com/$REPOSITORY/blob/$RELEASE_TAG/docs/architecture.md).
          - This alpha build is unsigned and not notarized. Review the platform warning before opening it.
          - GGUF model weights remain separate publisher downloads; they are not bundled in these installers.
          EOF
          release_flags=(--generate-notes --notes-file "$notes_file")
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "release-assets/SHA256SUMS" \
            release-assets/darwin-arm64/*.zip \
            release-assets/win32-x64/*.zip \
            release-assets/linux-x64/*.deb \
            --title "Free Local Agent $RELEASE_VERSION" \
            "${release_flags[@]}"
